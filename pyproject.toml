[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompts-hub"
version = "0.1.0"
description = "A Python project for managing reusable prompts."
requires-python = ">=3.10"

[project.scripts]
prompts-hub-health = "prompts_hub.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
